
name: Build Reboot Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ativar suporte Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Obter dependencias
        working-directory: gui
        run: flutter pub get

      - name: Compilar launcher Windows
        working-directory: gui
        run: flutter build windows --release

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Reboot-Launcher-Windows
          path: gui/build/windows/x64/runner/Release/
          if-no-files-found: error
